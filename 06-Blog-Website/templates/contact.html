<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - My Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get In Touch</h2>

        <p>Email: example@gmail.com</p>

        <form>
            <label>Name:</label>
            <input type="text">

            <br><br>

            <label>Email:</label>
            <input type="email">

            <br><br>

            <label>Message:</label>
            <textarea></textarea>

            <br><br>

            <button type="submit">Send</button>
        </form>
    </main>

</body>
</html>
