<!DOCTYPE html>
<html>

<head>
    <title>Color Learning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Learn Colors</h1>

    <h2 id="red" class="color-title">Red</h2>
    <img src="https://placehold.co/200x200/ff0000/ffffff?text=RED" alt="Red color">

    <h2 id="blue" class="color-title">Blue</h2>
    <img src="https://placehold.co/200x200/0000ff/ffffff?text=BLUE" alt="Blue color">

    <h2 id="green" class="color-title">Green</h2>
    <img src="https://placehold.co/200x200/008000/ffffff?text=GREEN" alt="Green color">

    <h2 id="yellow" class="color-title">Yellow</h2>
    <img src="https://placehold.co/200x200/ffff00/000000?text=YELLOW" alt="Yellow color">

    <h2 id="purple" class="color-title">Purple</h2>
    <img src="https://placehold.co/200x200/800080/ffffff?text=PURPLE" alt="Purple color">

</body>

</html>
